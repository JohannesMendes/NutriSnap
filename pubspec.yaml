name: nutrisnap
description: "NutriSnap - Evolução & Nutrição Inteligente"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # Armazenamento 100% local (sem servidor, sem custo)
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Notificações locais (lembretes de água/refeição)
  flutter_local_notifications: ^17.0.0
  timezone: ^0.9.2
  permission_handler: ^11.3.0

  # Câmera, foto e galeria de evolução visual
  image_picker: ^1.0.7
  gal: ^2.3.0

  # Chamada HTTP pra API do Gemini (scanner de prato)
  http: ^1.2.0

  # Gerenciamento de estado simples
  provider: ^6.1.2

  # Ícones e fontes modernas
  google_fonts: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
