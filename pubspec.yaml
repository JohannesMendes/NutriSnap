name: nutrisnap
description: "NutriSnap - Evolução & Nutrição Inteligente"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # Armazenamento 100% local (sem servidor, sem custo)
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.2

  # Backup manual (exportar/importar JSON)
  share_plus: ^7.2.2
  file_picker: ^6.2.0

  # Notificações locais (lembretes de água/refeição)
  flutter_local_notifications: ^17.0.0

  # Câmera e imagem (registro de refeições e fotos diárias)
  image_picker: ^1.0.7

  # Chamada HTTP pra API de IA (Gemini)
  http: ^1.2.0

  # Gerenciamento de estado simples
  provider: ^6.1.2

  # Ícones e fontes modernas
  google_fonts: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
