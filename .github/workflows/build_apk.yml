name: Build APK

# Roda automaticamente toda vez que você subir código na branch main,
# e também permite rodar manualmente pela aba "Actions" no GitHub.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código do repositório
        uses: actions/checkout@v4

      - name: Instalar o Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Gerar pastas nativas (android/ios) se não existirem
        run: flutter create . --platforms=android --org com.nutrisnap --project-name nutrisnap

      - name: Instalar dependências do projeto
        run: flutter pub get

      - name: Atualizar pacotes para versões compatíveis
        run: flutter pub upgrade --major-versions

      - name: Compilar o APK (release)
        run: flutter build apk --release

      - name: Disponibilizar o APK pra download
        uses: actions/upload-artifact@v4
        with:
          name: nutrisnap-apk
          path: build/app/outputs/flutter-apk/app-release.apk
