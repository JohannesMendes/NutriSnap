name: Build APK

# Roda automaticamente toda vez que você subir código na branch main,
# e também permite rodar manualmente pela aba "Actions" no GitHub.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Baixar o código do repositório
        uses: actions/checkout@v4

      - name: Instalar o Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Gerar pasta nativa (android) sem tocar no código-fonte
        run: |
          flutter create --platforms=android --org com.nutrisnap --project-name nutrisnap /tmp/nutrisnap_scaffold
          cp -r /tmp/nutrisnap_scaffold/android .

      - name: "[DEBUG] Verificar se o secret está chegando"
        run: |
          echo -n '${{ secrets.GOOGLE_SERVICES_JSON }}' | wc -c

      - name: Adicionar arquivo de configuração do Firebase (google-services.json)
        run: |
          cat > android/app/google-services.json << 'EOF'
          ${{ secrets.GOOGLE_SERVICES_JSON }}
          EOF
          python3 -c "import json; json.load(open('android/app/google-services.json'))" \
            && echo "google-services.json válido" \
            || (echo "google-services.json ausente, vazio ou inválido — confira o secret GOOGLE_SERVICES_JSON nas Settings do repositório" && exit 1)

      - name: Gerar lib/firebase_options.dart de verdade a partir do google-services.json
        # O arquivo que estava no repo era só um placeholder (valores tipo
        # 'SUBSTITUA_VIA_FLUTTERFIRE_CONFIGURE'), nunca gerado de verdade via
        # `flutterfire configure`. Isso causava o erro [core/duplicate-app]
        # (o Android já inicializava o Firebase sozinho com o
        # google-services.json real, e o Flutter tentava inicializar de novo
        # com dados falsos) e fazia login/cadastro falharem sempre. Gerando
        # aqui a partir do MESMO google-services.json real usado pelo Gradle,
        # os dois lados ficam sempre em sincronia.
        shell: python3 {0}
        run: |
          import json

          with open("android/app/google-services.json") as f:
              gs = json.load(f)

          project_info = gs["project_info"]
          client = gs["client"][0]
          api_key = client["api_key"][0]["current_key"]
          app_id = client["client_info"]["mobilesdk_app_id"]

          lines = [
              "// ignore_for_file: type=lint",
              "import 'package:firebase_core/firebase_core.dart' show FirebaseOptions;",
              "import 'package:flutter/foundation.dart' show kIsWeb, TargetPlatform, defaultTargetPlatform;",
              "",
              "/// Gerado automaticamente pelo workflow de build (build_apk.yml) a partir",
              "/// do google-services.json real (secret GOOGLE_SERVICES_JSON). Não edite",
              "/// esse arquivo à mão — ele é sobrescrito a cada build.",
              "class DefaultFirebaseOptions {",
              "  static FirebaseOptions get currentPlatform {",
              "    if (kIsWeb) {",
              "      throw UnsupportedError(",
              "        'DefaultFirebaseOptions não foi configurado pra Web.',",
              "      );",
              "    }",
              "    switch (defaultTargetPlatform) {",
              "      case TargetPlatform.android:",
              "        return android;",
              "      default:",
              "        throw UnsupportedError(",
              "          'DefaultFirebaseOptions só está configurado pra Android no momento.',",
              "        );",
              "    }",
              "  }",
              "",
              "  static const FirebaseOptions android = FirebaseOptions(",
              f"    apiKey: '{api_key}',",
              f"    appId: '{app_id}',",
              f"    messagingSenderId: '{project_info['project_number']}',",
              f"    projectId: '{project_info['project_id']}',",
              f"    storageBucket: '{project_info['storage_bucket']}',",
              "  );",
              "}",
              "",
          ]

          with open("lib/firebase_options.dart", "w") as f:
              f.write("\n".join(lines))

          print("lib/firebase_options.dart gerado com projectId =", project_info["project_id"])

      - name: Ativar o plugin do Google Services no Gradle
        shell: python3 {0}
        run: |
          import os, re

          # --- 1) Declara o plugin no nível do projeto (settings.gradle.kts ou settings.gradle) ---
          settings_kts = "android/settings.gradle.kts"
          settings_groovy = "android/settings.gradle"
          settings_is_kts = os.path.exists(settings_kts)
          settings_path = settings_kts if settings_is_kts else settings_groovy

          with open(settings_path, "r") as f:
              settings_content = f.read()

          if "com.google.gms.google-services" not in settings_content:
              if settings_is_kts:
                  plugin_line = '    id("com.google.gms.google-services") version "4.4.2" apply false\n'
              else:
                  plugin_line = "    id 'com.google.gms.google-services' version '4.4.2' apply false\n"

              # Insere logo após a abertura do bloco "plugins {" que já existe no template do Flutter
              settings_content = re.sub(
                  r"(plugins\s*\{\n)",
                  r"\1" + plugin_line,
                  settings_content,
                  count=1,
              )

              with open(settings_path, "w") as f:
                  f.write(settings_content)

          # --- 2) Aplica o plugin no módulo do app (android/app/build.gradle.kts ou .gradle) ---
          app_kts = "android/app/build.gradle.kts"
          app_groovy = "android/app/build.gradle"
          app_is_kts = os.path.exists(app_kts)
          app_path = app_kts if app_is_kts else app_groovy

          with open(app_path, "r") as f:
              app_content = f.read()

          if "com.google.gms.google-services" not in app_content:
              apply_line = (
                  '    id("com.google.gms.google-services")\n'
                  if app_is_kts else
                  "    id 'com.google.gms.google-services'\n"
              )
              app_content = re.sub(
                  r"(plugins\s*\{\n)",
                  r"\1" + apply_line,
                  app_content,
                  count=1,
              )
              with open(app_path, "w") as f:
                  f.write(app_content)

          print(f"Patched {settings_path} and {app_path}")

      - name: Adicionar permissões necessárias (internet + notificações/alarmes)
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          PERMS='    <uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />\n    <uses-permission android:name="android.permission.USE_EXACT_ALARM" />\n    <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />'
          sed -i "s#<manifest xmlns:android=\"http://schemas.android.com/apk/res/android\">#<manifest xmlns:android=\"http://schemas.android.com/apk/res/android\">\n$PERMS#" "$MANIFEST"
          grep -q "android.permission.INTERNET" "$MANIFEST" && grep -q "SCHEDULE_EXACT_ALARM" "$MANIFEST" && echo "Permissões adicionadas com sucesso" || (echo "Falha ao adicionar permissões" && exit 1)

      - name: Ajustar o nome exibido no launcher do celular
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          sed -i 's#android:label="[^"]*"#android:label="NutriSnap"#' "$MANIFEST"
          grep -q 'android:label="NutriSnap"' "$MANIFEST" && echo "Nome do app ajustado" || (echo "Falha ao ajustar o nome" && exit 1)

      - name: Ativar core library desugaring (necessário pra notificações)
        shell: python3 {0}
        run: |
          import re, os

          kts_path = "android/app/build.gradle.kts"
          groovy_path = "android/app/build.gradle"
          is_kts = os.path.exists(kts_path)
          path = kts_path if is_kts else groovy_path

          with open(path, "r") as f:
              content = f.read()

          # 1. Habilita o desugaring dentro do bloco compileOptions
          desugar_flag = (
              "        isCoreLibraryDesugaringEnabled = true\n"
              if is_kts else
              "        coreLibraryDesugaringEnabled true\n"
          )
          if "CoreLibraryDesugaringEnabled" not in content:
              content = re.sub(
                  r"(compileOptions\s*\{\n)",
                  r"\1" + desugar_flag,
                  content,
                  count=1,
              )

          # 2. Adiciona a lib de desugaring nas dependencies do módulo
          dep_line = (
              '    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")\n'
              if is_kts else
              "    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'\n"
          )
          if "desugar_jdk_libs" not in content:
              if re.search(r"dependencies\s*\{\s*\}", content):
                  # Bloco existe e está vazio -> preenche
                  content = re.sub(
                      r"dependencies\s*\{\s*\}",
                      "dependencies {\n" + dep_line + "}",
                      content,
                      count=1,
                  )
              elif re.search(r"dependencies\s*\{", content):
                  # Bloco existe e já tem conteúdo -> insere a primeira linha
                  content = re.sub(
                      r"(dependencies\s*\{\n)",
                      r"\1" + dep_line,
                      content,
                      count=1,
                  )
              else:
                  # Bloco não existe (comum nos templates novos do Flutter) -> cria do zero no fim do arquivo
                  content = content.rstrip() + "\n\ndependencies {\n" + dep_line + "}\n"

          with open(path, "w") as f:
              f.write(content)

          print(f"Patched {path}")

      - name: Instalar dependências do projeto
        run: flutter pub get

      - name: Garantir minSdkVersion 23 (exigido pelo Firebase Auth)
        shell: python3 {0}
        run: |
          import os, re

          kts_path = "android/app/build.gradle.kts"
          groovy_path = "android/app/build.gradle"
          is_kts = os.path.exists(kts_path)
          path = kts_path if is_kts else groovy_path

          with open(path, "r") as f:
              content = f.read()

          if is_kts:
              # Templates novos usam "minSdk = flutter.minSdkVersion" (variável),
              # que hoje aponta pra uma versão menor que 23 — trocamos pelo
              # valor fixo mínimo exigido pelo Firebase Auth.
              content = re.sub(r"minSdk\s*=\s*[^\n]+", "minSdk = 23", content, count=1)
          else:
              content = re.sub(r"minSdkVersion\s+[^\n]+", "minSdkVersion 23", content, count=1)

          with open(path, "w") as f:
              f.write(content)

          print(f"Patched minSdk in {path}")

      - name: Gerar ícone do app a partir da logo nova
        run: dart run flutter_launcher_icons

      - name: Compilar o APK (release)
        # A chave do Gemini não vai mais pro app: ela mora só no backend
        # (Firebase Cloud Functions, como Secret). Aqui só passamos a URL
        # pública da função — que não é segredo, pode ficar em texto puro.
        run: flutter build apk --release --dart-define=BACKEND_BASE_URL=${{ secrets.BACKEND_BASE_URL }}

      - name: Renomear o APK com a versão do build
        run: cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/NutriSnap.apk

      - name: Publicar release pública com link direto de download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "NutriSnap — build ${{ github.run_number }}"
          files: build/app/outputs/flutter-apk/NutriSnap.apk
          body: "Build automático gerado a partir do commit ${{ github.sha }}."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
